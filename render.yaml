services:
  - type: web
    name: uriona-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run prisma:migrate:deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALIEXPRESS_API_URL
        value: https://api-sg.aliexpress.com/sync
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false
      - key: ALIEXPRESS_REDIRECT_URI
        value: https://uriona-api.onrender.com/api/v1/integrations/aliexpress/oauth/callback
      - key: ALIEXPRESS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ALIEXPRESS_OAUTH_SETUP_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false